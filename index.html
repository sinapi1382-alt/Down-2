<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلودر حرفه‌ای</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: monospace;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-clean {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 10px;
        }
        
        .status {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success {
            color: #28a745;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            color: #856404;
            background: #fff3cd;
            border: 1px solid #ffeeba;
        }
        
        .links {
            margin-top: 15px;
        }
        
        .links a {
            display: block;
            padding: 8px;
            background: #f8f9fa;
            margin: 5px 0;
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }
        
        .links a:hover {
            background: #e9ecef;
        }
        
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📥 دانلودر حرفه‌ای</h1>
            <div class="subtitle">لینک مستقیم فایل رو وارد کن، ما دانلودش میکنیم</div>
            
            <div class="input-group">
                <label>🔗 لینک دانلود</label>
                <textarea id="url" placeholder="https://example.com/file.zip"></textarea>
            </div>
            
            <div class="input-group">
                <label>🔐 رمز فایل زیپ (اختیاری)</label>
                <input type="text" id="password" placeholder="رمز رو اینجا بنویس...">
            </div>
            
            <button id="downloadBtn">🚀 شروع دانلود</button>
            <button id="cleanBtn" class="btn-clean">🧹 پاکسازی پوشه دانلود</button>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="card" id="filesCard" style="display:none;">
            <h3>📂 فایل‌های دانلود شده</h3>
            <div id="filesList" class="links"></div>
        </div>
        
        <div class="footer">
            <p>ساخته شده با ❤️ | فایل‌ها توی پوشه downloads ذخیره میشن</p>
        </div>
    </div>
    
    <script>
        const repo = 'sinapi1382-alt/Down-2';
        
        async function triggerWorkflow(action, inputs) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status show info';
            statusDiv.innerHTML = '<span class="loading"></span> در حال اجرا... صبر کن';
            
            try {
                // فراخوانی API گیت‌هاب برای اجرای workflow
                const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${action}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: inputs
                    })
                });
                
                if (response.ok) {
                    statusDiv.className = 'status show success';
                    statusDiv.innerHTML = '✅ عملیات با موفقیت شروع شد! صفحه رو بعد از 1 دقیقه رفرش کن تا فایل‌ها رو ببینی.';
                    setTimeout(() => loadFiles(), 60000);
                } else {
                    const error = await response.text();
                    statusDiv.className = 'status show error';
                    statusDiv.innerHTML = `❌ خطا: ${response.status} - لطفاً دوباره تلاش کن`;
                }
            } catch (err) {
                statusDiv.className = 'status show error';
                statusDiv.innerHTML = `❌ خطای شبکه: ${err.message}`;
            }
        }
        
        async function loadFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/downloads`);
                if (response.ok) {
                    const files = await response.json();
                    const filesCard = document.getElementById('filesCard');
                    const filesList = document.getElementById('filesList');
                    
                    if (files.length > 0 && !(files.length === 1 && files[0].name === '.gitkeep')) {
                        filesList.innerHTML = '<strong>📁 فایل‌های موجود:</strong>';
                        for (const file of files) {
                            if (file.name !== '.gitkeep') {
                                filesList.innerHTML += `<a href="${file.download_url}" target="_blank">📄 ${file.name} (${Math.round(file.size/1024)} KB)</a>`;
                            }
                        }
                        filesCard.style.display = 'block';
                    } else {
                        filesList.innerHTML = '<p style="color:#666;">پوشه downloads خالی هست. یه دانلود جدید انجام بده.</p>';
                        filesCard.style.display = 'block';
                    }
                }
            } catch (err) {
                console.log('خطا در دریافت لیست فایل‌ها');
            }
        }
        
        document.getElementById('downloadBtn').onclick = () => {
            const url = document.getElementById('url').value.trim();
            const password = document.getElementById('password').value;
            
            if (!url) {
                alert('لطفاً لینک دانلود رو وارد کن');
                return;
            }
            
            triggerWorkflow('download.yml', {
                urls: url,
                password: password
            });
        };
        
        document.getElementById('cleanBtn').onclick = () => {
            if (confirm('⚠️ مطمئنی میخوای همه فایل‌های پوشه downloads رو پاک کنی؟')) {
                triggerWorkflow('clean.yml', {
                    confirm: 'yes'
                });
                setTimeout(() => loadFiles(), 30000);
            }
        };
        
        // بارگذاری فایل‌ها هنگام باز شدن صفحه
        loadFiles();
    </script>
</body>
</html>
