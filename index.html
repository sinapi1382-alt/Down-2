<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلودر حرفه‌ای</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .btn-clean {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .result {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            word-break: break-all;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success {
            color: #28a745;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            color: #856404;
            background: #fff3cd;
            border: 1px solid #ffeeba;
        }
        
        hr {
            margin: 15px 0;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 11px;
        }
        
        .note {
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📥 دانلودر حرفه‌ای</h1>
            <div class="subtitle">لینک مستقیم فایل رو وارد کن، من دانلودش میکنم</div>
            
            <div class="input-group">
                <label>🔗 لینک دانلود</label>
                <textarea id="url" rows="2" placeholder="https://example.com/file.zip"></textarea>
            </div>
            
            <div class="input-group">
                <label>🔐 رمز فایل زیپ (اختیاری)</label>
                <input type="text" id="password" placeholder="رمز رو اینجا بنویس...">
            </div>
            
            <div class="input-group">
                <label>📂 نوع عملیات</label>
                <select id="action">
                    <option value="download">دانلود فایل</option>
                    <option value="browser">مرورگر (HTML + اسکرین شات)</option>
                    <option value="search">جستجو در وب</option>
                </select>
            </div>
            
            <button id="runBtn">🚀 اجرا</button>
            
            <div id="result" class="result"></div>
            
            <div class="note">
                💡 بعد از اجرا، چند دقیقه صبر کن.<br>
                نتیجه در پوشه مربوطه در ریپازیتوری ذخیره میشه.
            </div>
        </div>
        
        <div class="footer">
            ساخته شده با ❤️ | فایل‌ها در پوشه downloads ذخیره میشن
        </div>
    </div>
    
    <script>
        const repo = 'sinapi1382-alt/Down-2';
        
        async function runWorkflow(workflow, inputs) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show info';
            resultDiv.innerHTML = '<span class="loading"></span> در حال اجرا... لطفاً صبر کن';
            
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: inputs
                    })
                });
                
                if (response.ok) {
                    resultDiv.className = 'result show success';
                    resultDiv.innerHTML = '✅ عملیات با موفقیت شروع شد!<br>بعد از چند دقیقه نتیجه رو در ریپازیتوری چک کن.';
                } else {
                    resultDiv.className = 'result show error';
                    resultDiv.innerHTML = `❌ خطا: ${response.status}<br>مطمئن شو workflow وجود داره.`;
                }
            } catch (err) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `❌ خطای شبکه: ${err.message}`;
            }
        }
        
        document.getElementById('runBtn').onclick = () => {
            const url = document.getElementById('url').value.trim();
            const password = document.getElementById('password').value;
            const action = document.getElementById('action').value;
            
            if (!url && action !== 'search') {
                alert('لطفاً لینک رو وارد کن');
                return;
            }
            
            if (action === 'download') {
                runWorkflow('download.yml', { urls: url, password: password });
            } else if (action === 'browser') {
                runWorkflow('browser.yml', { url: url, action: 'both' });
            } else if (action === 'search') {
                const query = prompt('عبارت جستجو رو وارد کن:', url || 'mp4 video');
                if (query) {
                    runWorkflow('duckduckgo-search.yml', { query: query, search_type: 'videos', num_results: '15' });
                }
            }
        };
    </script>
</body>
</html>
