name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create web files with token
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GitHub Controller</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{font-family:Arial;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
                  .container{max-width:600px;margin:0 auto}
                  .card{background:white;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
                  h1{color:#333;text-align:center;margin-bottom:20px;font-size:24px}
                  select,textarea,input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:14px}
                  button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer}
                  .result{background:#f8f9fa;padding:15px;border-radius:10px;margin-top:20px;display:none;word-break:break-all}
                  .success{color:#28a745;background:#d4edda}
                  .error{color:#dc3545;background:#f8d7da}
                  .info{color:#856404;background:#fff3cd}
                  .loading{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
                  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
                  .footer{text-align:center;color:rgba(255,255,255,0.8);font-size:11px;margin-top:20px}
                  .result-link{display:inline-block;margin-top:10px;color:#667eea;text-decoration:none}
              </style>
          </head>
          <body>
          <div class="container">
          <div class="card">
          <h1>🎮 GitHub Controller</h1>
          <select id="workflowSelect">
              <option value="download">📥 Download File</option>
              <option value="video">🎬 Download Video</option>
              <option value="browser">🌐 Web Browser</option>
              <option value="search">🔍 DuckDuckGo Search</option>
              <option value="clean">🧹 Clean Downloads</option>
          </select>
          
          <div id="downloadInputs">
              <textarea id="url" rows="2" placeholder="Enter URL"></textarea>
              <input type="text" id="password" placeholder="Password (optional)">
          </div>
          
          <div id="browserInputs" style="display:none">
              <textarea id="browserUrl" rows="2" placeholder="Website URL"></textarea>
              <select id="browserAction">
                  <option value="screenshot">Screenshot only</option>
                  <option value="media">Media only</option>
                  <option value="both">Both</option>
              </select>
          </div>
          
          <div id="searchInputs" style="display:none">
              <input type="text" id="searchQuery" placeholder="Search query">
              <input type="number" id="searchNum" value="15" placeholder="Number of results">
              <select id="searchType">
                  <option value="videos">Videos</option>
                  <option value="images">Images</option>
                  <option value="all">All</option>
              </select>
          </div>
          
          <button id="runBtn">🚀 Run</button>
          <div id="result" class="result"></div>
          </div>
          <div class="footer">Powered by GitHub Actions</div>
          </div>
          
          <script>
          const repo = 'sinapi1382-alt/Down-2';
          const token = '${{ secrets.GH_TOKEN }}';
          
          function showResult(type, msg) {
              const div = document.getElementById('result');
              div.className = 'result show ' + type;
              div.innerHTML = msg;
              div.style.display = 'block';
          }
          
          async function runWorkflow(workflow, inputs, outputFolder) {
              showResult('info', '<span class="loading"></span> Running...');
              try {
                  const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'Authorization': 'Bearer ' + token
                      },
                      body: JSON.stringify({ ref: 'main', inputs: inputs })
                  });
                  if (res.ok) {
                      const resultUrl = `https://github.com/${repo}/tree/main/${outputFolder}`;
                      showResult('success', '✅ Workflow started successfully!<br><br>📂 <a href="' + resultUrl + '" target="_blank" class="result-link">Click here to see results</a>');
                  } else {
                      showResult('error', '❌ Error: ' + res.status);
                  }
              } catch(e) { showResult('error', '❌ Error: ' + e.message); }
          }
          
          function updateInputs() {
              const val = document.getElementById('workflowSelect').value;
              document.getElementById('downloadInputs').style.display = (val === 'download' || val === 'video') ? 'block' : 'none';
              document.getElementById('browserInputs').style.display = (val === 'browser') ? 'block' : 'none';
              document.getElementById('searchInputs').style.display = (val === 'search') ? 'block' : 'none';
          }
          
          document.getElementById('workflowSelect').onchange = updateInputs;
          document.getElementById('runBtn').onclick = () => {
              const selected = document.getElementById('workflowSelect').value;
              if (selected === 'download') {
                  const url = document.getElementById('url').value.trim();
                  if (!url) { alert('Enter URL'); return; }
                  runWorkflow('download.yml', { urls: url, password: document.getElementById('password').value }, 'downloads');
              } else if (selected === 'video') {
                  const url = document.getElementById('url').value.trim();
                  if (!url) { alert('Enter video URL'); return; }
                  runWorkflow('video-downloader.yml', { urls: url, password: document.getElementById('password').value }, 'video-downloads');
              } else if (selected === 'browser') {
                  const url = document.getElementById('browserUrl').value.trim();
                  if (!url) { alert('Enter website URL'); return; }
                  runWorkflow('browser.yml', { url: url, action: document.getElementById('browserAction').value }, 'browser-output');
              } else if (selected === 'search') {
                  const query = document.getElementById('searchQuery').value.trim();
                  if (!query) { alert('Enter search query'); return; }
                  runWorkflow('duckduckgo-search.yml', {
                      query: query,
                      search_type: document.getElementById('searchType').value,
                      num_results: document.getElementById('searchNum').value
                  }, 'duckduckgo-results');
              } else if (selected === 'clean') {
                  if (confirm('Delete all files in downloads folder?')) {
                      runWorkflow('clean.yml', { confirm: 'yes' }, 'downloads');
                  }
              }
          };
          updateInputs();
          </script>
          </body>
          </html>
          HTMLEOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK to repository folder
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
          
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "actions@github.com"
          git add apk-files/
          git commit -m "Add latest APK build" || echo "No changes"
          git push
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
