name: ساخت اپلیکیشن اندروید

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: آماده‌سازی فایل‌های وب
        run: |
          mkdir -p www
          # کپی کردن فایل‌های اصلی به پوشه www
          cp index.html www/ 2>/dev/null || echo "index.html پیدا نشد"
          cp style.css www/ 2>/dev/null || echo "style.css پیدا نشد"
          cp manifest.json www/ 2>/dev/null || echo "manifest.json پیدا نشد"
          # اگه فایل دیگه‌ای داری اینجا اضافه کن
          
          # اگه هیچ فایلی وجود نداشت، یه فایل ساده بساز
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Downloader</title></head><body><h1>دانلودر حرفه‌ای</h1></body></html>' > www/index.html
          fi

      - name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: ساخت پروژه Capacitor
        run: |
          npx cap init Downloader com.downloader.app --web-dir=www
          npx cap add android

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: کپی APK به پوشه
        run: |
          mkdir -p apk-files
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
            echo "✅ APK ساخته شد"
          else
            echo "❌ فایل APK پیدا نشد"
            ls -la android/app/build/outputs/apk/debug/ || echo "پوشه apk وجود ندارد"
            exit 1
          fi

      - name: ذخیره در ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "افزودن اپلیکیشن" || echo "تغییری نیست"
          git push

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
