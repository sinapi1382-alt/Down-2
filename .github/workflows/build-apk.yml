name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create app
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html dir="rtl" lang="fa">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GitHub Controller</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:Tahoma;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
          .container{max-width:700px;margin:0 auto}
          .card{background:white;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
          h1{color:#333;text-align:center;margin-bottom:20px;font-size:22px}
          select,textarea,input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:14px}
          button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:10px;margin:5px 0;font-size:16px;cursor:pointer}
          .result{padding:15px;border-radius:10px;margin-top:20px;display:none}
          .success{background:#d4edda;color:#28a745}
          .error{background:#f8d7da;color:#dc3545}
          .info{background:#fff3cd;color:#856404}
          .loading{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
          @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
          .footer{text-align:center;color:rgba(255,255,255,0.8);font-size:11px;margin-top:20px}
          .tab{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;overflow-x:auto}
          .tab-btn{background:#e9ecef;color:#333;flex:1;padding:10px;border:none;border-radius:10px;cursor:pointer;font-size:12px;min-width:70px}
          .tab-btn.active{background:#667eea;color:white}
          .tab-content{display:none}
          .tab-content.active{display:block}
          .file-list{background:#f8f9fa;border-radius:10px;padding:10px;margin-top:10px;max-height:350px;overflow-y:auto}
          .file-item{background:white;padding:12px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd}
          .file-name{font-size:12px;word-break:break-all;flex:1}
          .file-download{background:#28a745;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
          .screenshot-img{max-width:100%;border-radius:10px;margin-top:10px;cursor:pointer;border:1px solid #ddd}
          .progress-bar{background:#e9ecef;border-radius:10px;margin:15px 0;height:25px;overflow:hidden}
          .progress-fill{background:#28a745;width:0%;height:100%;color:white;text-align:center;font-size:12px;line-height:25px}
          .section-title{background:#e9ecef;padding:8px 12px;border-radius:10px;margin:15px 0 10px 0;font-weight:bold;color:#333}
          .refresh-btn{background:#6c757d;margin-bottom:10px;padding:8px 12px;font-size:12px}
          .refresh-small{background:#6c757d;margin-right:10px;padding:5px 10px;font-size:11px;width:auto;display:inline-block}
          .folder-buttons{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
          .folder-btn{background:#28a745;flex:1;padding:10px;font-size:13px;margin:0}
          .folder-btn-blue{background:#17a2b8}
          </style>
          </head>
          <body>
          <div class="container"><div class="card">
          <h1>🎮 GitHub Controller</h1>
          <div class="tab">
              <button class="tab-btn active" onclick="showTab('run')">🚀 اجرا</button>
              <button class="tab-btn" onclick="showTab('progress')">📊 در حال اجرا</button>
              <button class="tab-btn" onclick="showTab('downloads')">📥 دانلودها</button>
              <button class="tab-btn" onclick="showTab('browser')">🌐 مرورگر</button>
              <button class="tab-btn" onclick="showTab('search')">🔍 داک داک گو</button>
              <button class="tab-btn" onclick="showTab('video')">🎬 ویدیوها</button>
              <button class="tab-btn" onclick="showTab('torrent')">🧲 تورنت</button>
          </div>
          
          <div id="tab-run" class="tab-content active">
              <select id="workflowSelect">
                  <option value="download">📥 دانلود فایل عادی</option>
                  <option value="video">🎬 دانلود ویدیو</option>
                  <option value="browser">🌐 مرورگر خودکار</option>
                  <option value="search">🔍 جستجو در DuckDuckGo</option>
                  <option value="torrent">🧲 دانلود تورنت / مگنت</option>
                  <option value="clean">🧹 پاکسازی پوشه</option>
              </select>
              <div id="downloadInputs"><textarea id="url" rows="2" placeholder="لینک دانلود"></textarea><input type="text" id="password" placeholder="رمز (اختیاری)"></div>
              <div id="videoInputs" style="display:none"><textarea id="videoUrl" rows="2" placeholder="لینک ویدیو"></textarea><input type="text" id="videoPassword" placeholder="رمز (اختیاری)"><input type="text" id="videoReferer" placeholder="Referer (اختیاری)"></div>
              <div id="browserInputs" style="display:none"><textarea id="browserUrl" rows="2" placeholder="آدرس سایت"></textarea></div>
              <div id="searchInputs" style="display:none"><input type="text" id="searchQuery" placeholder="عبارت جستجو"><input type="number" id="searchNum" value="15" placeholder="تعداد نتایج"><select id="searchType"><option value="all">همه موارد</option><option value="videos">ویدیوها</option><option value="images">عکس‌ها</option></select></div>
              <div id="torrentInputs" style="display:none"><textarea id="torrentUrl" rows="2" placeholder="لینک مگنت (magnet:?xt=urn:btih:...) یا فایل .torrent"></textarea><input type="text" id="torrentPassword" placeholder="رمز (اختیاری)"></div>
              <button id="runBtn">🚀 اجرا</button>
              <div class="folder-buttons">
                  <button id="openDownloadsBtn" class="folder-btn">📁 پوشه دانلودها</button>
                  <button id="openVideoBtn" class="folder-btn">🎬 پوشه ویدیوها</button>
                  <button id="openTorrentBtn" class="folder-btn">🧲 پوشه تورنت</button>
              </div>
              <div class="folder-buttons">
                  <button id="openBrowserBtn" class="folder-btn folder-btn-blue">🌐 پوشه مرورگر</button>
                  <button id="openSearchBtn" class="folder-btn folder-btn-blue">🔍 پوشه داک داک گو</button>
              </div>
              <div id="result" class="result"></div>
          </div>
          
          <div id="tab-progress" class="tab-content"><div id="activeTasks">هیچ کاری در حال اجرا نیست</div></div>
          
          <div id="tab-downloads" class="tab-content"><button class="file-download refresh-btn" onclick="loadFiles('downloads','downloadsList')">🔄 Refresh</button><div id="downloadsList" class="file-list">Loading...</div></div>
          
          <div id="tab-browser" class="tab-content">
              <div><button class="refresh-small" onclick="loadBrowserScreenshots()">🔄 اسکرین شات</button><button class="refresh-small" onclick="loadFiles('browser-output','browserFiles')">🔄 سایر فایل‌ها</button></div>
              <div class="section-title">📸 اسکرین شات‌ها</div>
              <div id="browserScreenshots" class="file-list">Loading...</div>
              <div class="section-title">📄 سایر فایل‌ها</div>
              <div id="browserFiles" class="file-list">Loading...</div>
          </div>
          
          <div id="tab-search" class="tab-content">
              <div><button class="refresh-small" onclick="loadSearchScreenshots()">🔄 اسکرین شات</button><button class="refresh-small" onclick="loadFiles('duckduckgo-results','searchFiles')">🔄 سایر فایل‌ها</button></div>
              <div class="section-title">📸 اسکرین شات‌ها</div>
              <div id="searchScreenshots" class="file-list">Loading...</div>
              <div class="section-title">📄 سایر فایل‌ها</div>
              <div id="searchFiles" class="file-list">Loading...</div>
          </div>
          
          <div id="tab-video" class="tab-content"><button class="file-download refresh-btn" onclick="loadFiles('video-downloads','videoList')">🔄 Refresh</button><div id="videoList" class="file-list">Loading...</div></div>
          
          <div id="tab-torrent" class="tab-content"><button class="file-download refresh-btn" onclick="loadFiles('torrent-downloads','torrentList')">🔄 Refresh</button><div id="torrentList" class="file-list">Loading...</div></div>
          
          </div><div class="footer">Powered by GitHub Actions</div></div>
          
          <script>
          const TOKEN = '${{ secrets.GH_TOKEN }}';
          const REPO = 'sinapi1382-alt/Down-2';
          let activeTask = null, checkInterval = null;
          
          function showTab(n){
              document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
              document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
              document.getElementById('tab-'+n).classList.add('active');
              if(n==='downloads') loadFiles('downloads','downloadsList');
              if(n==='browser') { loadBrowserScreenshots(); loadFiles('browser-output','browserFiles'); }
              if(n==='search') { loadSearchScreenshots(); loadFiles('duckduckgo-results','searchFiles'); }
              if(n==='video') loadFiles('video-downloads','videoList');
              if(n==='torrent') loadFiles('torrent-downloads','torrentList');
          }
          
          function showResult(t,m){const d=document.getElementById('result');d.className='result '+t;d.innerHTML=m;d.style.display='block';}
          
          function simulateProgress(f,name){
              activeTask={name:name,outputFolder:f,progress:0};let p=0;
              if(checkInterval)clearInterval(checkInterval);
              checkInterval=setInterval(()=>{
                  p+=5;
                  if(p>=100){
                      clearInterval(checkInterval);
                      document.getElementById('activeTasks').innerHTML='<div class="file-item"><div><strong>'+name+'</strong><div class="progress-bar"><div class="progress-fill" style="width:100%">100%</div></div><button class="file-download" onclick="window.open(`https://github.com/${REPO}/tree/main/${f}`)">📂 مشاهده نتیجه</button></div></div>';
                      activeTask=null;
                  }else{
                      document.getElementById('activeTasks').innerHTML='<div class="file-item"><div><strong>'+name+'</strong><div class="progress-bar"><div class="progress-fill" style="width:'+p+'%">'+p+'%</div></div><span>در حال اجرا...</span></div></div>';
                  }
              },2000);
          }
          
          async function runWorkflow(w,i,f,n){
              showResult('info','<span class="loading"></span> در حال اجرا...');
              simulateProgress(f,n);
              try{
                  const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${w}/dispatches`,{
                      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
                      body:JSON.stringify({ref:'main',inputs:i})
                  });
                  if(r.ok){
                      showResult('success','✅ شروع شد!');
                      setTimeout(()=>{loadFiles('downloads','downloadsList');loadFiles('video-downloads','videoList');loadBrowserScreenshots();loadFiles('browser-output','browserFiles');loadSearchScreenshots();loadFiles('duckduckgo-results','searchFiles');loadFiles('torrent-downloads','torrentList');},30000);
                  }else showResult('error','❌ خطا: '+r.status);
              }catch(e){showResult('error','❌ خطا: '+e.message);}
          }
          
          async function loadFiles(f,e){
              const c=document.getElementById(e); if(!c) return;
              c.innerHTML='<span class="loading"></span> Loading...';
              try{
                  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${f}`,{headers:{'Authorization':'Bearer '+TOKEN}});
                  if(r.ok){
                      const files=await r.json();
                      let h='';
                      for(const file of files) if(file.name!=='.gitkeep') h+='<div class="file-item"><span class="file-name">📄 '+file.name+'</span><button class="file-download" onclick="window.open(`'+file.download_url+'`)">دانلود</button></div>';
                      c.innerHTML=h||'فایلی نیست';
                  }else c.innerHTML='فایلی نیست';
              }catch(e){c.innerHTML='خطا: '+e.message;}
          }
          
          async function loadBrowserScreenshots(){
              const c=document.getElementById('browserScreenshots'); if(!c) return;
              c.innerHTML='<span class="loading"></span> Loading...';
              try{
                  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/browser-output`,{headers:{'Authorization':'Bearer '+TOKEN}});
                  if(r.ok){
                      const files=await r.json();
                      let h='';
                      for(const file of files){
                          if(file.name.includes('screenshot_')&&file.name.endsWith('.png')){
                              h+='<div class="file-item" style="flex-direction:column;align-items:stretch"><div><strong>📸 '+file.name+'</strong></div><img src="'+file.download_url+'?raw=true" class="screenshot-img" onclick="window.open(`'+file.download_url+'`)"><button class="file-download" style="margin-top:10px" onclick="window.open(`'+file.download_url+'`)">دانلود</button></div>';
                          }
                      }
                      c.innerHTML=h||'اسکرین شاتی نیست';
                  }else c.innerHTML='اسکرین شاتی نیست';
              }catch(e){c.innerHTML='خطا: '+e.message;}
          }
          
          async function loadSearchScreenshots(){
              const c=document.getElementById('searchScreenshots'); if(!c) return;
              c.innerHTML='<span class="loading"></span> Loading...';
              try{
                  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/duckduckgo-results`,{headers:{'Authorization':'Bearer '+TOKEN}});
                  if(r.ok){
                      const files=await r.json();
                      let h='';
                      for(const file of files){
                          if(file.name.includes('screenshot_')&&file.name.endsWith('.png')){
                              h+='<div class="file-item" style="flex-direction:column;align-items:stretch"><div><strong>📸 '+file.name+'</strong></div><img src="'+file.download_url+'?raw=true" class="screenshot-img" onclick="window.open(`'+file.download_url+'`)"><button class="file-download" style="margin-top:10px" onclick="window.open(`'+file.download_url+'`)">دانلود</button></div>';
                          }
                      }
                      c.innerHTML=h||'اسکرین شاتی نیست';
                  }else c.innerHTML='اسکرین شاتی نیست';
              }catch(e){c.innerHTML='خطا: '+e.message;}
          }
          
          function updateInputs(){
              const v=document.getElementById('workflowSelect').value;
              document.getElementById('downloadInputs').style.display=(v==='download')?'block':'none';
              document.getElementById('videoInputs').style.display=(v==='video')?'block':'none';
              document.getElementById('browserInputs').style.display=(v==='browser')?'block':'none';
              document.getElementById('searchInputs').style.display=(v==='search')?'block':'none';
              document.getElementById('torrentInputs').style.display=(v==='torrent')?'block':'none';
          }
          
          document.getElementById('workflowSelect').onchange=updateInputs;
          document.getElementById('runBtn').onclick=()=>{
              const s=document.getElementById('workflowSelect').value;
              if(s==='download'){
                  const u=document.getElementById('url').value.trim();
                  if(!u){alert('لینک رو وارد کن');return;}
                  runWorkflow('download.yml',{urls:u,password:document.getElementById('password').value},'downloads','دانلود فایل');
              }
              else if(s==='video'){
                  const u=document.getElementById('videoUrl').value.trim();
                  if(!u){alert('لینک ویدیو رو وارد کن');return;}
                  runWorkflow('video-downloader.yml',{
                      urls:u,
                      password:document.getElementById('videoPassword').value,
                      referer:document.getElementById('videoReferer').value
                  },'video-downloads','دانلود ویدیو');
              }
              else if(s==='browser'){
                  const u=document.getElementById('browserUrl').value.trim();
                  if(!u){alert('آدرس سایت رو وارد کن');return;}
                  runWorkflow('browser.yml',{url:u,action:'both'},'browser-output','مرورگر');
              }
              else if(s==='search'){
                  const q=document.getElementById('searchQuery').value.trim();
                  if(!q){alert('عبارت جستجو رو وارد کن');return;}
                  runWorkflow('duckduckgo-search.yml',{query:q,search_type:document.getElementById('searchType').value,num_results:document.getElementById('searchNum').value},'duckduckgo-results','جستجو');
              }
              else if(s==='torrent'){
                  const u=document.getElementById('torrentUrl').value.trim();
                  if(!u){alert('لینک مگنت یا تورنت رو وارد کن');return;}
                  runWorkflow('torrent-downloader.yml',{magnet:u,password:document.getElementById('torrentPassword').value},'torrent-downloads','دانلود تورنت');
              }
              else if(s==='clean'){
                  if(confirm('پوشه downloads پاک شود؟')) runWorkflow('clean.yml',{confirm:'yes'},'downloads','پاکسازی');
              }
          };
          
          // دکمه‌های دسترسی مستقیم به پوشه‌ها
          document.getElementById('openDownloadsBtn').onclick = () => window.open(`https://github.com/${REPO}/tree/main/downloads`, '_blank');
          document.getElementById('openVideoBtn').onclick = () => window.open(`https://github.com/${REPO}/tree/main/video-downloads`, '_blank');
          document.getElementById('openTorrentBtn').onclick = () => window.open(`https://github.com/${REPO}/tree/main/torrent-downloads`, '_blank');
          document.getElementById('openBrowserBtn').onclick = () => window.open(`https://github.com/${REPO}/tree/main/browser-output`, '_blank');
          document.getElementById('openSearchBtn').onclick = () => window.open(`https://github.com/${REPO}/tree/main/duckduckgo-results`, '_blank');
          
          updateInputs();
          </script>
          </body>
          </html>
          EOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/controller-app.apk
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git pull origin main --rebase || true
          git add apk-files/
          git commit -m "Add app" || echo "No changes"
          git push origin main
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: controller-app
          path: apk-files/controller-app.apk
