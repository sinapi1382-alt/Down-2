name: ساخت اپلیکیشن اندروید

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: آماده‌سازی فایل‌های وب
        run: |
          mkdir -p www
          
          # نمایش لیست فایل‌ها برای دیباگ
          echo "📁 فایل‌های موجود در ریشه:"
          ls -la
          
          # کپی کردن index.html (اگر وجود داشته باشه)
          if [ -f "index.html" ]; then
            cp index.html www/
            echo "✅ index.html کپی شد"
          else
            echo "❌ index.html پیدا نشد!"
            # ساختن یک نمونه ساده
            echo '<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8"><title>دانلودر</title></head>
<body style="font-family:Tahoma;background:#667eea;text-align:center;padding:50px">
<h1>📥 دانلودر حرفه‌ای</h1>
<p>فایل index.html اصلی پیدا نشد</p>
<p>لطفا فایل index.html را به ریپازیتوری اضافه کنید</p>
</body>
</html>' > www/index.html
          fi
          
          # کپی سایر فایل‌های مهم
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          
          echo "📁 محتویات پوشه www:"
          ls -la www/

      - name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: ساخت پروژه Capacitor
        run: |
          npx cap init Downloader com.downloader.app --web-dir=www
          npx cap add android

      - name: کپی نهایی فایل‌ها به پروژه اندروید
        run: |
          # اطمینان از کپی شدن فایل‌ها
          cp -r www/* android/app/src/main/assets/public/ 2>/dev/null || true
          cp www/index.html android/app/src/main/assets/public/ 2>/dev/null || true

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: کپی APK به پوشه
        run: |
          mkdir -p apk-files
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
            echo "✅ APK ساخته شد"
            ls -la apk-files/
          else
            echo "❌ فایل APK پیدا نشد"
            exit 1
          fi

      - name: ذخیره در ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "افزودن اپلیکیشن" || echo "تغییری نیست"
          git push

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
