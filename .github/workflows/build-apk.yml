name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create web files
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html dir="rtl" lang="fa">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>کنترلر گیت‌هاب</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{font-family:Tahoma;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
                  .container{max-width:600px;margin:0 auto}
                  .card{background:white;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
                  h1{color:#333;text-align:center;margin-bottom:10px;font-size:24px}
                  h2{color:#667eea;font-size:18px;margin-bottom:15px;border-right:3px solid #667eea;padding-right:10px}
                  .subtitle{text-align:center;color:#666;margin-bottom:25px;font-size:14px}
                  .input-group{margin-bottom:20px}
                  label{display:block;margin-bottom:8px;color:#333;font-weight:bold}
                  input,textarea,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit}
                  input:focus,textarea:focus,select:focus{outline:none;border-color:#667eea}
                  button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
                  button:active{transform:scale(0.98)}
                  .btn-clean{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
                  .result{background:#f8f9fa;border-radius:10px;padding:15px;margin-top:20px;font-size:13px;word-break:break-all;display:none}
                  .result.show{display:block}
                  .loading{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
                  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
                  .success{color:#28a745;background:#d4edda;border:1px solid #c3e6cb}
                  .error{color:#dc3545;background:#f8d7da;border:1px solid #f5c6cb}
                  .info{color:#856404;background:#fff3cd;border:1px solid #ffeeba}
                  .footer{text-align:center;color:rgba(255,255,255,0.8);font-size:11px;margin-top:20px}
                  .workflow-select{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:20px}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="card">
                      <h1>🎮 کنترلر گیت‌هاب</h1>
                      <div class="subtitle">اجرای workflow ها از داخل گوشی</div>
                      
                      <div class="workflow-select">
                          <label>📋 انتخاب عملیات</label>
                          <select id="workflowSelect">
                              <option value="download">📥 دانلود فایل (download.yml)</option>
                              <option value="video">🎬 دانلود ویدیو (video-downloader.yml)</option>
                              <option value="browser">🌐 مرورگر خودکار (browser.yml)</option>
                              <option value="search">🔍 جستجو در DuckDuckGo</option>
                              <option value="clean">🧹 پاکسازی پوشه دانلود</option>
                          </select>
                      </div>
                      
                      <div id="downloadInputs" class="input-group">
                          <label>🔗 لینک دانلود</label>
                          <textarea id="url" rows="2" placeholder="https://example.com/file.zip"></textarea>
                          
                          <label>🔐 رمز فایل زیپ (اختیاری)</label>
                          <input type="text" id="password" placeholder="رمز رو اینجا بنویس...">
                      </div>
                      
                      <div id="browserInputs" class="input-group" style="display:none">
                          <label>🌐 آدرس سایت</label>
                          <textarea id="browserUrl" rows="2" placeholder="https://example.com"></textarea>
                          
                          <label>📸 نوع عملیات</label>
                          <select id="browserAction">
                              <option value="screenshot">فقط اسکرین شات</option>
                              <option value="media">فقط لینک‌های مدیا</option>
                              <option value="both">اسکرین شات + لینک‌های مدیا</option>
                          </select>
                      </div>
                      
                      <div id="searchInputs" class="input-group" style="display:none">
                          <label>🔍 عبارت جستجو</label>
                          <input type="text" id="searchQuery" placeholder="mp4 video download">
                          
                          <label>📊 تعداد نتایج</label>
                          <input type="number" id="searchNum" value="15" placeholder="15">
                          
                          <label>🎯 نوع جستجو</label>
                          <select id="searchType">
                              <option value="videos">ویدیوها</option>
                              <option value="images">عکس‌ها</option>
                              <option value="all">همه موارد</option>
                          </select>
                      </div>
                      
                      <button id="runBtn">🚀 اجرا</button>
                      
                      <div id="result" class="result"></div>
                  </div>
                  <div class="footer">ساخته شده با ❤️ | فایل‌ها در ریپازیتوری ذخیره میشن</div>
              </div>
              
              <script>
                  const repo = 'sinapi1382-alt/Down-2';
                  
                  function showResult(type, msg) {
                      const div = document.getElementById('result');
                      div.className = 'result show ' + type;
                      div.innerHTML = msg;
                  }
                  
                  async function runWorkflow(workflow, inputs) {
                      showResult('info', '<span class="loading"></span> در حال اجرا... لطفاً صبر کن');
                      try {
                          const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ ref: 'main', inputs: inputs })
                          });
                          if (response.ok) {
                              showResult('success', '✅ عملیات با موفقیت شروع شد!<br>بعد از چند دقیقه نتیجه رو در ریپازیتوری چک کن.');
                          } else {
                              showResult('error', '❌ خطا: ' + response.status + '<br>مطمئن شو workflow وجود داره.');
                          }
                      } catch(err) {
                          showResult('error', '❌ خطای شبکه: ' + err.message);
                      }
                  }
                  
                  function updateInputs() {
                      const selected = document.getElementById('workflowSelect').value;
                      document.getElementById('downloadInputs').style.display = 'none';
                      document.getElementById('browserInputs').style.display = 'none';
                      document.getElementById('searchInputs').style.display = 'none';
                      
                      if (selected === 'download') document.getElementById('downloadInputs').style.display = 'block';
                      else if (selected === 'video') document.getElementById('downloadInputs').style.display = 'block';
                      else if (selected === 'browser') document.getElementById('browserInputs').style.display = 'block';
                      else if (selected === 'search') document.getElementById('searchInputs').style.display = 'block';
                  }
                  
                  document.getElementById('workflowSelect').onchange = updateInputs;
                  
                  document.getElementById('runBtn').onclick = () => {
                      const selected = document.getElementById('workflowSelect').value;
                      
                      if (selected === 'download') {
                          const url = document.getElementById('url').value.trim();
                          if (!url) { alert('لطفاً لینک رو وارد کن'); return; }
                          runWorkflow('download.yml', { urls: url, password: document.getElementById('password').value });
                          
                      } else if (selected === 'video') {
                          const url = document.getElementById('url').value.trim();
                          if (!url) { alert('لطفاً لینک ویدیو رو وارد کن'); return; }
                          runWorkflow('video-downloader.yml', { urls: url, password: document.getElementById('password').value });
                          
                      } else if (selected === 'browser') {
                          const url = document.getElementById('browserUrl').value.trim();
                          if (!url) { alert('لطفاً آدرس سایت رو وارد کن'); return; }
                          runWorkflow('browser.yml', { url: url, action: document.getElementById('browserAction').value });
                          
                      } else if (selected === 'search') {
                          const query = document.getElementById('searchQuery').value.trim();
                          if (!query) { alert('لطفاً عبارت جستجو رو وارد کن'); return; }
                          runWorkflow('duckduckgo-search.yml', { 
                              query: query, 
                              search_type: document.getElementById('searchType').value,
                              num_results: document.getElementById('searchNum').value
                          });
                          
                      } else if (selected === 'clean') {
                          if (confirm('⚠️ مطمئنی میخوای همه فایل‌های پوشه downloads رو پاک کنی؟')) {
                              runWorkflow('clean.yml', { confirm: 'yes' });
                          }
                      }
                  };
                  
                  updateInputs();
              </script>
          </body>
          </html>
          HTMLEOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK to repository folder
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
          
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "Add latest APK build" || echo "No changes"
          git push
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
