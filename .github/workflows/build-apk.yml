name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create web files with token
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GitHub Controller</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{font-family:Arial;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
                  .container{max-width:700px;margin:0 auto}
                  .card{background:white;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
                  h1{color:#333;text-align:center;margin-bottom:20px}
                  h2{color:#667eea;font-size:18px;margin-bottom:15px;border-bottom:2px solid #667eea;padding-bottom:5px}
                  select,textarea,input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:14px}
                  button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin:5px 0}
                  button:active{transform:scale(0.98)}
                  .result{background:#f8f9fa;padding:15px;border-radius:10px;margin-top:20px;display:none;word-break:break-all}
                  .success{color:#28a745;background:#d4edda}
                  .error{color:#dc3545;background:#f8d7da}
                  .info{color:#856404;background:#fff3cd}
                  .loading{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
                  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
                  .footer{text-align:center;color:rgba(255,255,255,0.8);font-size:11px;margin-top:20px}
                  .file-list{background:#f8f9fa;border-radius:10px;padding:10px;margin-top:15px}
                  .file-item{background:white;padding:12px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd}
                  .file-name{color:#333;word-break:break-all;flex:1}
                  .file-download{background:#28a745;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;margin-left:10px}
                  .screenshot-img{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid #ddd}
                  .refresh-btn{background:#6c757d;margin-top:10px}
                  .tab{display:flex;gap:10px;margin-bottom:20px}
                  .tab-btn{background:#e9ecef;color:#333;flex:1;padding:10px;border:none;border-radius:10px;cursor:pointer}
                  .tab-btn.active{background:#667eea;color:white}
                  .tab-content{display:none}
                  .tab-content.active{display:block}
                  .progress-bar{background:#e9ecef;border-radius:10px;margin:15px 0;height:20px;overflow:hidden}
                  .progress-fill{background:#28a745;width:0%;height:100%;transition:width 0.5s;color:white;text-align:center;font-size:12px;line-height:20px}
                  .status-badge{padding:5px 10px;border-radius:20px;font-size:12px;margin-left:10px}
                  .status-running{background:#ffc107;color:#333}
                  .status-done{background:#28a745;color:white}
                  .view-result-btn{background:#667eea;color:white;border:none;padding:10px;border-radius:10px;margin-top:10px;cursor:pointer}
              </style>
          </head>
          <body>
          <div class="container">
          <div class="card">
          <h1>🎮 GitHub Controller</h1>
          
          <div class="tab">
              <button class="tab-btn active" onclick="showTab('run')">🚀 اجرا</button>
              <button class="tab-btn" onclick="showTab('progress')">📊 در حال اجرا</button>
              <button class="tab-btn" onclick="showTab('files')">📂 فایل‌ها</button>
              <button class="tab-btn" onclick="showTab('screenshots')">📸 اسکرین شات</button>
          </div>
          
          <div id="tab-run" class="tab-content active">
          <select id="workflowSelect">
              <option value="download">📥 Download File</option>
              <option value="video">🎬 Download Video</option>
              <option value="browser">🌐 Web Browser</option>
              <option value="search">🔍 DuckDuckGo Search</option>
              <option value="clean">🧹 Clean Downloads</option>
          </select>
          
          <div id="downloadInputs">
              <textarea id="url" rows="2" placeholder="Enter URL"></textarea>
              <input type="text" id="password" placeholder="Password (optional)">
          </div>
          
          <div id="browserInputs" style="display:none">
              <textarea id="browserUrl" rows="2" placeholder="Website URL"></textarea>
              <select id="browserAction">
                  <option value="screenshot">Screenshot only</option>
                  <option value="media">Media only</option>
                  <option value="both">Both</option>
              </select>
          </div>
          
          <div id="searchInputs" style="display:none">
              <input type="text" id="searchQuery" placeholder="Search query">
              <input type="number" id="searchNum" value="15">
              <select id="searchType">
                  <option value="videos">Videos</option>
                  <option value="images">Images</option>
                  <option value="all">All</option>
              </select>
          </div>
          
          <button id="runBtn">🚀 Run</button>
          <div id="result" class="result"></div>
          </div>
          
          <div id="tab-progress" class="tab-content">
              <div id="activeTasks" style="margin-bottom:15px">
                  <p>No active tasks. Run a workflow from the "Run" tab.</p>
              </div>
          </div>
          
          <div id="tab-files" class="tab-content">
              <button class="refresh-btn" onclick="loadFiles()">🔄 Refresh</button>
              <div id="filesList" class="file-list">Loading...</div>
          </div>
          
          <div id="tab-screenshots" class="tab-content">
              <button class="refresh-btn" onclick="loadScreenshots()">🔄 Refresh</button>
              <div id="screenshotsList" class="file-list">Loading...</div>
          </div>
          
          </div>
          <div class="footer">Powered by GitHub Actions</div>
          </div>
          
          <script>
          const repo = 'sinapi1382-alt/Down-2';
          const token = '${{ secrets.GH_TOKEN }}';
          
          let activeTask = null;
          let checkInterval = null;
          
          function showTab(tabName) {
              document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
              document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
              document.getElementById('tab-' + tabName).classList.add('active');
              if (tabName === 'files') loadFiles();
              if (tabName === 'screenshots') loadScreenshots();
              if (tabName === 'progress') updateProgressTab();
          }
          
          function showResult(type, msg) {
              const div = document.getElementById('result');
              div.className = 'result show ' + type;
              div.innerHTML = msg;
              div.style.display = 'block';
          }
          
          function updateProgressTab() {
              const container = document.getElementById('activeTasks');
              if (activeTask) {
                  container.innerHTML = `
                      <div class="file-item">
                          <div style="flex:1">
                              <strong>📥 ${activeTask.name}</strong>
                              <div class="progress-bar">
                                  <div class="progress-fill" style="width:${activeTask.progress}%">${activeTask.progress}%</div>
                              </div>
                              <p style="margin-top:10px">Status: <span class="status-badge status-running">Running...</span></p>
                              <button class="view-result-btn" onclick="viewResult()">📂 View Result When Done</button>
                          </div>
                      </div>
                  `;
              } else {
                  container.innerHTML = '<p>No active tasks. Run a workflow from the "Run" tab.</p>';
              }
          }
          
          function viewResult() {
              if (activeTask && activeTask.outputFolder) {
                  window.open(`https://github.com/${repo}/tree/main/${activeTask.outputFolder}`, '_blank');
              }
          }
          
          function simulateProgress(outputFolder, taskName) {
              activeTask = { name: taskName, outputFolder: outputFolder, progress: 0 };
              updateProgressTab();
              showTab('progress');
              
              let progress = 0;
              if (checkInterval) clearInterval(checkInterval);
              
              checkInterval = setInterval(() => {
                  progress += 5;
                  if (progress >= 100) {
                      clearInterval(checkInterval);
                      activeTask.progress = 100;
                      updateProgressTab();
                      const container = document.getElementById('activeTasks');
                      if (container) {
                          const statusSpan = container.querySelector('.status-badge');
                          if (statusSpan) {
                              statusSpan.className = 'status-badge status-done';
                              statusSpan.textContent = 'Completed!';
                          }
                          const btn = container.querySelector('.view-result-btn');
                          if (btn) btn.style.display = 'block';
                      }
                      activeTask = null;
                      setTimeout(() => { loadFiles(); loadScreenshots(); }, 2000);
                  } else {
                      activeTask.progress = progress;
                      updateProgressTab();
                  }
              }, 2000);
          }
          
          async function runWorkflow(workflow, inputs, outputFolder, taskName) {
              showResult('info', '<span class="loading"></span> Running...');
              simulateProgress(outputFolder, taskName);
              
              try {
                  const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                      body: JSON.stringify({ ref: 'main', inputs: inputs })
                  });
                  if (res.ok) {
                      showResult('success', '✅ Started! Check "Progress" tab.');
                  } else {
                      showResult('error', '❌ Error: ' + res.status);
                      clearInterval(checkInterval);
                      activeTask = null;
                      updateProgressTab();
                  }
              } catch(e) { 
                  showResult('error', '❌ Error: ' + e.message);
                  clearInterval(checkInterval);
                  activeTask = null;
                  updateProgressTab();
              }
          }
          
          async function loadFiles() {
              const container = document.getElementById('filesList');
              container.innerHTML = '<span class="loading"></span> Loading...';
              try {
                  const res = await fetch(`https://api.github.com/repos/${repo}/contents/`, {
                      headers: { 'Authorization': 'Bearer ' + token }
                  });
                  const folders = await res.json();
                  let html = '';
                  for (const folder of folders) {
                      if (folder.type === 'dir' && ['downloads','browser-output','duckduckgo-results','video-downloads'].includes(folder.name)) {
                          html += `<h3>📁 ${folder.name}</h3>`;
                          const filesRes = await fetch(folder.url, { headers: { 'Authorization': 'Bearer ' + token } });
                          const files = await filesRes.json();
                          for (const file of files) {
                              if (file.name !== '.gitkeep') {
                                  html += `<div class="file-item">
                                      <span class="file-name">📄 ${file.name}</span>
                                      <button class="file-download" onclick="downloadFile('${file.download_url}')">Download</button>
                                  </div>`;
                              }
                          }
                      }
                  }
                  container.innerHTML = html || 'No files found. Run a workflow first.';
              } catch(e) { container.innerHTML = 'Error: ' + e.message; }
          }
          
          async function loadScreenshots() {
              const container = document.getElementById('screenshotsList');
              container.innerHTML = '<span class="loading"></span> Loading...';
              try {
                  const res = await fetch(`https://api.github.com/repos/${repo}/contents/browser-output`, {
                      headers: { 'Authorization': 'Bearer ' + token }
                  });
                  if (res.ok) {
                      const files = await res.json();
                      let html = '';
                      for (const file of files) {
                          if (file.name.includes('.png')) {
                              html += `<div class="file-item">
                                  <div style="flex:1">
                                      <strong>📸 ${file.name}</strong>
                                      <img src="${file.download_url}?raw=true" class="screenshot-img" onclick="window.open('${file.download_url}')">
                                  </div>
                                  <button class="file-download" onclick="downloadFile('${file.download_url}')">Download</button>
                              </div>`;
                          }
                      }
                      container.innerHTML = html || 'No screenshots found. Run browser workflow first.';
                  } else {
                      container.innerHTML = 'No screenshots found. Go to "Run" tab and select "Web Browser".';
                  }
              } catch(e) { container.innerHTML = 'Error: ' + e.message; }
          }
          
          function downloadFile(url) {
              window.open(url, '_blank');
          }
          
          function updateInputs() {
              const val = document.getElementById('workflowSelect').value;
              document.getElementById('downloadInputs').style.display = (val === 'download' || val === 'video') ? 'block' : 'none';
              document.getElementById('browserInputs').style.display = (val === 'browser') ? 'block' : 'none';
              document.getElementById('searchInputs').style.display = (val === 'search') ? 'block' : 'none';
          }
          
          document.getElementById('workflowSelect').onchange = updateInputs;
          document.getElementById('runBtn').onclick = () => {
              const selected = document.getElementById('workflowSelect').value;
              if (selected === 'download') {
                  const url = document.getElementById('url').value.trim();
                  if (!url) { alert('Enter URL'); return; }
                  runWorkflow('download.yml', { urls: url, password: document.getElementById('password').value }, 'downloads', 'Download File');
              } else if (selected === 'video') {
                  const url = document.getElementById('url').value.trim();
                  if (!url) { alert('Enter video URL'); return; }
                  runWorkflow('video-downloader.yml', { urls: url, password: document.getElementById('password').value }, 'video-downloads', 'Download Video');
              } else if (selected === 'browser') {
                  const url = document.getElementById('browserUrl').value.trim();
                  if (!url) { alert('Enter website URL'); return; }
                  runWorkflow('browser.yml', { url: url, action: document.getElementById('browserAction').value }, 'browser-output', 'Web Browser');
              } else if (selected === 'search') {
                  const query = document.getElementById('searchQuery').value.trim();
                  if (!query) { alert('Enter search query'); return; }
                  runWorkflow('duckduckgo-search.yml', {
                      query: query,
                      search_type: document.getElementById('searchType').value,
                      num_results: document.getElementById('searchNum').value
                  }, 'duckduckgo-results', 'DuckDuckGo Search');
              } else if (selected === 'clean') {
                  if (confirm('Delete all files?')) {
                      runWorkflow('clean.yml', { confirm: 'yes' }, 'downloads', 'Clean Downloads');
                  }
              }
          };
          updateInputs();
          </script>
          </body>
          </html>
          HTMLEOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK to repository folder
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
          
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "Add latest APK build" || echo "No changes"
          git push
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
