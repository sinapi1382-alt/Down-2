name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create web files
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html dir="rtl" lang="fa">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>دانلودر حرفه‌ای</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{font-family:Tahoma;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
                  .container{max-width:600px;margin:0 auto}
                  .card{background:white;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
                  h1{color:#333;text-align:center;margin-bottom:10px;font-size:24px}
                  .subtitle{text-align:center;color:#666;margin-bottom:25px;font-size:14px}
                  .input-group{margin-bottom:20px}
                  label{display:block;margin-bottom:8px;color:#333;font-weight:bold}
                  input,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit}
                  input:focus,textarea:focus{outline:none;border-color:#667eea}
                  button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
                  .result{background:#f8f9fa;border-radius:10px;padding:15px;margin-top:20px;font-size:13px;display:none}
                  .result.show{display:block}
                  .loading{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
                  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
                  .success{color:#28a745;background:#d4edda}
                  .error{color:#dc3545;background:#f8d7da}
                  .info{color:#856404;background:#fff3cd}
                  .footer{text-align:center;color:rgba(255,255,255,0.8);font-size:11px;margin-top:20px}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="card">
                      <h1>📥 دانلودر حرفه‌ای</h1>
                      <div class="subtitle">لینک مستقیم فایل رو وارد کن، من دانلودش میکنم</div>
                      <textarea id="url" rows="2" placeholder="https://example.com/file.zip"></textarea>
                      <input type="text" id="password" placeholder="🔐 رمز فایل زیپ (اختیاری)">
                      <button id="runBtn">🚀 شروع دانلود</button>
                      <div id="result" class="result"></div>
                  </div>
                  <div class="footer">ساخته شده با ❤️ | فایل‌ها در پوشه downloads ذخیره میشن</div>
              </div>
              <script>
                  const repo = 'sinapi1382-alt/Down-2';
                  async function runWorkflow(workflow, inputs) {
                      const resultDiv = document.getElementById('result');
                      resultDiv.className = 'result show info';
                      resultDiv.innerHTML = '<span class="loading"></span> در حال اجرا...';
                      try {
                          const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
                              method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify({ref: 'main', inputs: inputs})
                          });
                          if (response.ok) resultDiv.className = 'result show success', resultDiv.innerHTML = '✅ عملیات شروع شد!';
                          else resultDiv.className = 'result show error', resultDiv.innerHTML = '❌ خطا: ' + response.status;
                      } catch(err) { resultDiv.className = 'result show error', resultDiv.innerHTML = '❌ خطا: ' + err.message; }
                  }
                  document.getElementById('runBtn').onclick = () => {
                      const url = document.getElementById('url').value.trim();
                      if (!url) { alert('لطفاً لینک رو وارد کن'); return; }
                      runWorkflow('download.yml', { urls: url, password: document.getElementById('password').value });
                  };
              </script>
          </body>
          </html>
          HTMLEOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK to repository folder
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
          
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "Add latest APK build" || echo "No changes"
          git push
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
