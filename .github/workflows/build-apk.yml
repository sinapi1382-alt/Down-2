name: ساخت APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: ساخت پوشه www
        run: mkdir -p www

      - name: ساخت index.html
        run: |
          echo '<!DOCTYPE html>
          <html dir="rtl">
          <head>
          <meta charset="UTF-8">
          <title>Downloader</title>
          <style>
          body{font-family:Tahoma;background:#667eea;padding:20px}
          .card{background:white;border-radius:20px;padding:25px;max-width:500px;margin:0 auto}
          h1{color:#333;text-align:center}
          input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ddd}
          button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:10px}
          </style>
          </head>
          <body>
          <div class="card">
          <h1>Downloader</h1>
          <input type="text" id="url" placeholder="Enter URL">
          <button onclick="run()">Download</button>
          </div>
          <script>
          function run(){
          var url=document.getElementById("url").value;
          fetch("https://api.github.com/repos/sinapi1382-alt/Down-2/actions/workflows/download.yml/dispatches",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ref:"main",inputs:{urls:url}})
          }).then(function(r){alert(r.ok?"Started!":"Error");});
          }
          </script>
          </body>
          </html>' > www/index.html

      - name: ساخت پروژه Capacitor
        run: |
          npx cap init "Downloader" "com.downloader.app" --web-dir=www
          npx cap add android

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
