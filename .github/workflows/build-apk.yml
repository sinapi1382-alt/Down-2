name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create web files
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>Downloader</title></head>
          <body style="font-family:Tahoma;background:#667eea;text-align:center;padding:50px">
          <h1>📥 Downloader</h1>
          <p>App is ready</p>
          </body>
          </html>
          HTMLEOF
          
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          
      - name: Build Android Project
        run: |
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Copy APK to repository folder
        run: |
          mkdir -p apk-files
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-files/downloader-app.apk
          echo "✅ APK copied to apk-files/downloader-app.apk"
          
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add apk-files/
          git commit -m "Add latest APK build" || echo "No changes to commit"
          git push
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-app
          path: apk-files/downloader-app.apk
