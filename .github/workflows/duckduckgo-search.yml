name: جستجو در DuckDuckGo

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'عبارت جستجو'
        required: true
        type: string
      num_results:
        description: 'تعداد نتایج'
        required: false
        default: '15'
        type: string

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: نصب Puppeteer
        run: npm install puppeteer
      
      - name: اجرای جستجو
        run: node duckduckgo-search.js
        env:
          INPUT_QUERY: ${{ inputs.query }}
          INPUT_NUM: ${{ inputs.num_results }}
      
      - name: ذخیره خروجی
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add duckduckgo-results/
          git commit -m "افزودن نتایج جستجو" || true
          git push
      
      - name: آپلود نتایج
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-results
          path: duckduckgo-results/
