name: دانلودر با لینک صحیح برای ADM

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'لینک دانلود (فقط یک لینک)'
        required: true
        type: string
      password:
        description: 'رمز فایل زیپ (اختیاری)'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: دریافت کدها
      uses: actions/checkout@v4
    
    - name: نصب ابزارها
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 zip
    
    - name: دانلود و تقسیم
      run: |
        rm -rf downloads
        mkdir -p downloads
        cd downloads
        
        URL="${{ inputs.urls }}"
        PASS="${{ inputs.password }}"
        
        echo "شروع دانلود از: $URL"
        
        FILENAME=$(basename "$URL" | cut -d '?' -f1)
        aria2c -x 16 -s 16 -o "$FILENAME" "$URL"
        
        if [ -f "$FILENAME" ]; then
            SIZE_MB=$(stat -c%s "$FILENAME" | awk '{print int($1/1024/1024)}')
            
            if [ $SIZE_MB -gt 50 ]; then
                echo "تقسیم به بخش‌های 50 مگابایتی..."
                if [ -n "$PASS" ]; then
                    zip -P "$PASS" -s 50m "پارت.zip" "$FILENAME"
                else
                    zip -s 50m "پارت.zip" "$FILENAME"
                fi
                rm "$FILENAME"
            else
                if [ -n "$PASS" ]; then
                    zip -P "$PASS" "download.zip" "$FILENAME"
                else
                    zip "download.zip" "$FILENAME"
                fi
                rm "$FILENAME"
            fi
        fi
        
        cd ..
        
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        git add downloads/
        git commit -m "افزودن فایل" || echo "ok"
        git push
        
        # ساخت لینک صحیح برای ADM
        cd downloads
        echo "========== لینک‌های قابل دانلود در ADM ==========" > لینک_ها.txt
        echo "" >> لینک_ها.txt
        echo "این لینک‌ها را در ADM وارد کن:" >> لینک_ها.txt
        echo "" >> لینک_ها.txt
        
        for FILE in *; do
            if [ -f "$FILE" ]; then
                echo "https://github.com/${{ github.repository }}/raw/main/downloads/$FILE" >> لینک_ها.txt
            fi
        done
        
        echo "" >> لینک_ها.txt
        echo "========== راهنما ==========" >> لینک_ها.txt
        echo "1. هر لینک رو جداگانه در ADM وارد کن" >> لینک_ها.txt
        echo "2. همه فایل‌ها رو دانلود کن" >> لینک_ها.txt
        if [ -n "$PASS" ]; then
            echo "3. رمز: $PASS" >> لینک_ها.txt
        fi
        
        git add لینک_ها.txt
        git commit -m "اضافه کردن لینک‌ها" || echo "ok"
        git push
        cd ..
    
    - name: آپلود
      uses: actions/upload-artifact@v4
      with:
        name: فایل-ها
        path: downloads/
