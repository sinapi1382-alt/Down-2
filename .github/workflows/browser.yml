name: Browser Tool

on:
  workflow_dispatch:
    inputs:
      url:
        description: website url
        required: true
        type: string
      action:
        description: action type
        required: true
        type: choice
        options:
          - screenshot
          - media
          - both

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: checkout
      uses: actions/checkout@v4
    
    - name: install wkhtmltopdf
      run: sudo apt-get install -y wkhtmltopdf
    
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: install puppeteer
      run: npm install puppeteer
    
    - name: run browser
      run: node script.js
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_ACTION: ${{ inputs.action }}
    
    - name: save output
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add browser-output/
        git commit -m "add browser output" || echo "no changes"
        git push
    
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: browser-output
        path: browser-output/
