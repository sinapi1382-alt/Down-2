name: مرورگر خودکار

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string
      action:
        description: 'نوع عملیات'
        required: true
        type: choice
        options:
          - screenshot
          - media
          - both

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: دریافت کدها
      uses: actions/checkout@v4
    
    - name: نصب Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: نصب Puppeteer
      run: |
        npm install puppeteer
    
    - name: اجرای مرورگر
      run: |
        mkdir -p browser-output
        
        node script.js
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_ACTION: ${{ inputs.action }}
    
    - name: ذخیره خروجی
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        git add browser-output/
        git commit -m "افزودن خروجی مرورگر" || echo "تغییری نیست"
        git push
    
    - name: آپلود خروجی
      uses: actions/upload-artifact@v4
      with:
        name: browser-output
        path: browser-output/
