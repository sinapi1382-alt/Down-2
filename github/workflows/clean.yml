name: پاکسازی پوشه دانلود

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای تایید پاکسازی "yes" بنویس'
        required: true
        type: string

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: دریافت کدها
      uses: actions/checkout@v4
    
    - name: پاکسازی پوشه downloads
      run: |
        # بررسی تایید
        if [ "${{ inputs.confirm }}" != "yes" ]; then
          echo "❌ پاکسازی انجام نشد. برای تایید باید 'yes' بنویسی"
          exit 1
        fi
        
        echo "🧹 در حال پاکسازی پوشه downloads..."
        
        # حذف پوشه و محتویاتش
        rm -rf downloads
        
        # دوباره ساختن پوشه خالی
        mkdir -p downloads
        
        # ساختن فایل .gitkeep برای حفظ پوشه
        echo "# پوشه خالی شده" > downloads/.gitkeep
        
        echo "✅ پوشه downloads با موفقیت پاک شد"
        
        # نمایش نتیجه
        ls -la downloads/
    
    - name: ذخیره تغییرات
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        git add downloads/
        git commit -m "پاکسازی پوشه downloads در $(date '+%Y-%m-%d %H:%M:%S')" || echo "تغییری نیست"
        git push
        
        echo "========================================="
        echo "✅ پاکسازی کامل شد!"
        echo "پوشه downloads الان خالی است"
        echo "========================================="
